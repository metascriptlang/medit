<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>medic</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e2e; }
  #canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<script>
  // One emscripten build per GPU backend: wgpu/ when the browser has WebGPU, else gl/;
  // ?gl or ?wgpu forces one.
  const p = new URLSearchParams(location.search);
  const dir = p.has('gl') ? 'gl' : p.has('wgpu') ? 'wgpu' : (navigator.gpu ? 'wgpu' : 'gl');
  window.medicLog = [];
  window.Module = {
    canvas: document.getElementById('canvas'),
    locateFile: (path) => dir + '/' + path,
    print: (t) => { window.medicLog.push(t); console.log(t); },
    printErr: (t) => { window.medicLog.push('ERR ' + t); console.error(t); },
  };
  const s = document.createElement('script');
  s.src = dir + '/medicWeb.js';
  s.onerror = () => { window.medicLog.push('failed to load ' + s.src); };
  document.body.appendChild(s);
</script>
</body>
</html>
